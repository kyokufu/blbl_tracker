name: Sync statistics
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write statistics (requires reviewed dry run and LIVE_SYNC_APPROVED)'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: notion-statistics-sync
  cancel-in-progress: false

jobs:
  sync:
    # Skipped jobs do not allocate a runner. Flags are deliberate owner gates,
    # not a substitute for actual account billing configuration or API testing.
    if: >-
      vars.COST_SAFEGUARDS_CONFIRMED == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
        (!inputs.apply || vars.LIVE_SYNC_APPROVED == 'true')) ||
       (github.event_name == 'schedule' && vars.SCHEDULE_ENABLED == 'true' &&
        vars.LIVE_SYNC_APPROVED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Sync (dry-run unless explicitly enabled)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TRACKER_CONFIG: ${{ secrets.TRACKER_CONFIG }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          if not os.environ.get('TRACKER_CONFIG', '').strip():
              sys.exit('TRACKER_CONFIG secret is missing')
          with tempfile.TemporaryDirectory() as directory:
              config = Path(directory) / 'config.toml'
              config.touch(mode=0o600)
              config.write_text(os.environ['TRACKER_CONFIG'])
              command = [sys.executable, '-m', 'blbl_tracker', '--config', str(config)]
              command += ['--apply' if os.environ.get('APPLY') == 'true' else '--dry-run']
              child_env = dict(os.environ)
              child_env.pop('TRACKER_CONFIG', None)
              result = subprocess.run(command, env=child_env, check=False)
          sys.exit(result.returncode)
          PY
